[package]
name = "dsh-desktop-shell-tauri"
version = "0.1.0"
edition = "2021"
description = "Tauri 2 shell for DeepSeek Harness over loopback HTTP"

[lib]
name = "dsh_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
base64 = "0.22"
rfd = "0.15"
